{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: relay
  labels:
    {{- include "relay.labels" . | nindent 4 }}
  {{- $annotations := .Values.ingress.annotations | default dict }}
  {{- if ne .Values.tls.issuer "none" }}
  {{- $annotations = merge (dict "cert-manager.io/issuer" (printf "relay-%s" .Values.tls.issuer)) $annotations }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: relay-control-plane, port: { name: http } } }
          - path: /ingest
            pathType: Prefix
            backend: { service: { name: relay-ingest, port: { name: http } } }
{{- end }}
