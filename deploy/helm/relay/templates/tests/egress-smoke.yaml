{{- if .Values.egressSmokeTest.enabled }}
# helm test: a pod with the worker's labels, so the worker's NetworkPolicy applies to it,
# tries to reach what a webhook must never reach. Every attempt must fail; the test fails
# if any connection succeeds.
apiVersion: v1
kind: Pod
metadata:
  name: relay-egress-smoke
  labels:
    {{- include "relay.labels" . | nindent 4 }}
    {{- include "relay.selector" (dict "root" . "component" "worker") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    # Kept after it finishes so `helm test --logs` can read the result; replaced on the next run.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  {{- include "relay.podSecurity" . | nindent 2 }}
  restartPolicy: Never
  containers:
    - name: smoke
      image: {{ include "relay.image" (dict "root" . "name" .Values.images.dataPlane) }}
      imagePullPolicy: {{ .Values.images.pullPolicy }}
      {{- include "relay.containerSecurity" . | nindent 6 }}
      env:
        - name: NODE_IP
          valueFrom: { fieldRef: { fieldPath: status.hostIP } }
        - name: PUBLIC_HOST
          value: {{ .Values.egressSmokeTest.publicHost | quote }}
        - name: WAIT_SECONDS
          value: {{ .Values.egressSmokeTest.waitSeconds | quote }}
        - name: TARGETS
          value: >-
            kubernetes.default.svc:443
            relay-control-plane:8081
            relay-ingest:8080
            $(NODE_IP):10250
            $(NODE_IP):6443
            $(NODE_IP):22
            169.254.169.254:80
            {{- range .Values.networkPolicy.extraBlockedCidrs }}
            {{ (split "/" .)._0 }}:443
            {{- end }}
      command:
        - python
        - -c
        - |
          import os, socket, sys, time
          # k3s's policy controller programs a new pod's rules a few seconds after it starts.
          # Retry until the policy holds or the deadline passes; only a steady state counts.
          targets = os.environ["TARGETS"].split()
          public = os.environ.get("PUBLIC_HOST")
          deadline = time.monotonic() + float(os.environ.get("WAIT_SECONDS", "60"))

          def check():
              lines, bad = [], []
              for target in targets:
                  host, port = target.rsplit(":", 1)
                  try:
                      socket.create_connection((host, int(port)), timeout=3).close()
                      bad.append(target)
                      lines.append(f"REACHABLE (must not be): {target}")
                  except OSError as e:
                      lines.append(f"blocked: {target} ({type(e).__name__})")
              if public:
                  try:
                      socket.create_connection((public, 443), timeout=5).close()
                      lines.append(f"reachable as required: {public}:443")
                  except OSError as e:
                      bad.append(f"{public}:443 unreachable")
                      lines.append(f"UNREACHABLE (must be reachable): {public}:443 ({e})")
              return lines, bad

          attempt = 0
          while True:
              attempt += 1
              lines, bad = check()
              if not bad or time.monotonic() >= deadline:
                  break
              time.sleep(3)
          print(f"after {attempt} attempt(s):")
          print("\n".join(lines))
          sys.exit(1 if bad else 0)
{{- end }}
