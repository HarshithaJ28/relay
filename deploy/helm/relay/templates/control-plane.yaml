{{- $sel := dict "root" . "component" "control-plane" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-control-plane
  labels:
    {{- include "relay.labels" . | nindent 4 }}
    {{- include "relay.selector" $sel | nindent 4 }}
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  selector:
    matchLabels:
      {{- include "relay.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "relay.labels" . | nindent 8 }}
        {{- include "relay.selector" $sel | nindent 8 }}
    spec:
      {{- include "relay.podSecurity" . | nindent 6 }}
      containers:
        - name: control-plane
          image: {{ include "relay.image" (dict "root" . "name" .Values.images.controlPlane) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- include "relay.containerSecurity" . | nindent 10 }}
          env:
            {{- include "relay.dbEnv" (dict "root" . "role" "relay_control" "var" "RELAY_CONTROL_DSN") | nindent 12 }}
            {{- include "relay.valkeyEnv" . | nindent 12 }}
            - name: RELAY_JWT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: jwt-secret } }
            - name: RELAY_SECRET_KEYS
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: secret-keys } }
            - name: STRIPE_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: stripe-secret-key, optional: true } }
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: stripe-webhook-secret, optional: true } }
            - name: STRIPE_PRICE_PRO
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: stripe-price-pro, optional: true } }
            - name: RELAY_PUBLIC_URL
              value: {{ .Values.publicUrl | quote }}
            - name: RELAY_TRUSTED_PROXY_HOPS
              value: {{ .Values.controlPlane.trustedProxyHops | quote }}
            - name: RELAY_COOKIE_SECURE
              value: "true"
            {{- range $k, $v := .Values.controlPlane.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - { name: http, containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: relay-control-plane
  labels:
    {{- include "relay.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "relay.selector" $sel | nindent 4 }}
  ports:
    - { name: http, port: 8081, targetPort: http }
