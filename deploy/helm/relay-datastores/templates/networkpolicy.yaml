{{- if .Values.networkPolicy.enabled }}
# The datastores accept connections only from the Relay components that use them, and
# open none of their own.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
  labels:
    {{- include "relay.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: relay
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
{{- range $store := list (dict "c" "postgres" "port" 5432 "from" (list "worker" "scheduler" "reaper" "publisher" "retention" "ingest" "control-plane" "migrate")) (dict "c" "rabbitmq" "port" 5672 "from" (list "worker" "scheduler" "reaper" "publisher" "ingest")) (dict "c" "valkey" "port" 6379 "from" (list "worker" "scheduler" "reaper" "publisher" "retention" "ingest" "control-plane")) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: relay-{{ $store.c }}-ingress
  labels:
    {{- include "relay.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "relay.selector" (dict "root" $ "component" $store.c) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/part-of, operator: In, values: [relay] }
              - { key: app.kubernetes.io/component, operator: In, values: [{{ join ", " $store.from }}] }
      ports:
        - { protocol: TCP, port: {{ $store.port }} }
{{- end }}
{{- end }}
