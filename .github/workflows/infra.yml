name: Infrastructure

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - deploy/**
      - db/**
      - services/**
      - .dockerignore
      - .github/workflows/infra.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KUBERNETES_VERSION: "1.31.0"
  K3S_VERSION: v1.31.4+k3s1

jobs:
  chart:
    name: Helm chart (lint, kubeconform)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.16.4
      - name: Install kubeconform
        run: |
          curl -sSfLo kc.tgz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  kc.tgz" | sha256sum -c -
          tar xzf kc.tgz kubeconform && sudo mv kubeconform /usr/local/bin/
      - name: helm lint
        run: |
          helm lint --strict deploy/helm/relay
          helm lint --strict deploy/helm/relay-datastores
      - name: kubeconform
        run: |
          for chart in relay relay-datastores; do
            for args in "" "--set networkPolicy.enabled=false"; do
              # shellcheck disable=SC2086
              helm template x "deploy/helm/$chart" $args |
                kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION"
            done
          done

  terraform:
    name: Terraform (fmt, validate, tflint)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.54.0
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff deploy/terraform
      # Validation only: no credentials, no backend, nothing is planned or applied.
      - name: terraform validate
        run: |
          for d in oci/bootstrap oci aws; do
            terraform -chdir="deploy/terraform/$d" init -backend=false -input=false
            terraform -chdir="deploy/terraform/$d" validate
          done
      - name: tflint
        working-directory: deploy/terraform
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          for d in oci/bootstrap oci aws; do tflint --chdir="$d" --config "$PWD/.tflint.hcl" -f compact; done

  config-scan:
    name: Trivy configuration scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  k3s:
    name: Chart on k3s (migrations, rollout, egress policy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: chart
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.16.4

      # k3s enforces NetworkPolicy with its embedded controller, as on the real host.
      - name: Install k3s
        run: |
          curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="$K3S_VERSION" sh -s - --write-kubeconfig-mode 644
          mkdir -p ~/.kube && cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
          # k3s creates the node, then CoreDNS, then Traefik (through a Helm install job), a
          # few seconds apart: wait for each to exist before waiting for it to be ready.
          for i in $(seq 90); do kubectl get nodes 2>/dev/null | grep -q " Ready" && break; sleep 2; done
          kubectl wait --for=condition=Ready node --all --timeout=60s
          for d in coredns traefik; do
            for i in $(seq 90); do kubectl -n kube-system get deployment "$d" >/dev/null 2>&1 && break; sleep 2; done
            kubectl -n kube-system rollout status deployment "$d" --timeout=180s
          done

      - name: Build the three images and load them into k3s
        run: |
          docker build -q -f services/data-plane/Dockerfile -t ghcr.io/harshithaj28/relay-data-plane:ci .
          docker build -q -f services/control-plane/Dockerfile -t ghcr.io/harshithaj28/relay-control-plane:ci .
          docker build -q -f db/Dockerfile -t ghcr.io/harshithaj28/relay-migrations:ci .
          docker save ghcr.io/harshithaj28/relay-data-plane:ci ghcr.io/harshithaj28/relay-control-plane:ci \
            ghcr.io/harshithaj28/relay-migrations:ci | sudo k3s ctr images import -

      - name: Create the namespace and a throwaway Secret
        run: |
          kubectl create namespace relay
          pw() { openssl rand -hex 24; }
          PG=$(pw)
          args=""
          for r in tenant control scheduler publisher worker reaper retention owner; do args="$args --from-literal=password-$r=$(pw)"; done
          # shellcheck disable=SC2086
          kubectl -n relay create secret generic relay-secrets $args \
            --from-literal=postgres-password="$PG" \
            --from-literal=postgres-superuser-url="postgres://postgres:$PG@relay-postgres:5432/relay?sslmode=disable" \
            --from-literal=amqp-password="$(pw)" \
            --from-literal=valkey-password="$(pw)" \
            --from-literal=jwt-secret="$(openssl rand -hex 32)" \
            --from-literal=secret-keys="ci-k1:$(openssl rand -base64 32)"

      - name: Install the datastores
        run: helm install relay-data deploy/helm/relay-datastores -n relay --wait --timeout 10m

      - name: helm install (the migration job runs first, then every rollout)
        run: |
          helm install relay deploy/helm/relay -n relay --wait --timeout 10m \
            --set images.tag=ci --set images.pullPolicy=Never \
            --set ingress.host=relay.ci.test --set publicUrl=https://relay.ci.test \
            --set egressSmokeTest.publicHost=github.com

      - name: The API answers through Traefik, and registration needs an invite
        run: |
          curl -sSf -H "Host: relay.ci.test" http://127.0.0.1/api/v1/openapi.json -o /dev/null
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: relay.ci.test" -H "content-type: application/json" \
            -d '{"invite_code":"rinv_x","tenant_name":"t","email":"a@example.com","password":"long enough password"}' \
            http://127.0.0.1/api/v1/auth/register)
          test "$code" = "403"

      - name: Egress smoke test (must be blocked; public HTTPS must work)
        run: helm test relay -n relay --logs --timeout 3m

      # The same test with the policies removed must fail, or it proves nothing.
      - name: Without the NetworkPolicy the smoke test fails
        run: |
          helm upgrade relay deploy/helm/relay -n relay --reuse-values --set networkPolicy.enabled=false --wait --timeout 5m
          if helm test relay -n relay --logs --timeout 3m; then
            echo "the egress smoke test passed without a NetworkPolicy"; exit 1
          fi

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n relay get pods,jobs,pvc,networkpolicies -o wide || true
          kubectl -n relay describe pods || true
          for p in $(kubectl -n relay get pods -o name); do echo "== $p"; kubectl -n relay logs "$p" --all-containers --tail=50 || true; done
