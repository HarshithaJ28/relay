# Local development stack. Development and tests only: PostgreSQL uses trust
# authentication (the Relay login roles have no passwords here), so every
# service publishes its ports on 127.0.0.1 only.
#
#   docker compose up -d --wait
#   RELAY_TEST_PG_DSN="host=127.0.0.1 port=5432" \
#   RELAY_TEST_AMQP_URL="amqp://guest:guest@127.0.0.1:5672/" \
#   RELAY_TEST_VALKEY_URL="valkey://127.0.0.1:6379/15" python3 -m pytest
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: relay
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d relay"]
      interval: 5s
      retries: 10
  valkey:
    image: valkey/valkey:8.1
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 10
  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10
